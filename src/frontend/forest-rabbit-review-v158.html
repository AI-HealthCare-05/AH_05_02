<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>당근의 숲 · 새로운 토끼 친구들</title>
  <style>
    :root { color-scheme: light; font-family: Pretendard, "Noto Sans KR", sans-serif; color: #244c39; background: #f2f6ee; }
    * { box-sizing: border-box; } body { margin: 0; padding: 36px 20px; }
    main { max-width: 960px; margin: auto; } header { display: flex; gap: 20px; justify-content: space-between; align-items: center; }
    h1 { font-size: 28px; margin: 12px 0; } h2 { font-size: 22px; margin: 0; } p { color: #657665; line-height: 1.6; }
    a, button { color: #fff; background: #286446; border: 0; border-radius: 12px; padding: 12px 18px; font: inherit; cursor: pointer; text-decoration: none; }
    a { white-space: nowrap; } button:hover, a:hover { background: #1b4b32; } button:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid #e79b38; outline-offset: 3px; }
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 28px; }
    article { border: 1px solid #d8e2cf; background: #fffefa; border-radius: 24px; padding: 24px; box-shadow: 0 10px 24px #35572c08; }
    .stage { margin: 20px 0; height: 240px; background: linear-gradient(#f5f7ec 69%,#dce7c9 69%,#e8eedb); border-radius: 18px; overflow: hidden; }
    canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
    label { display: block; font-size: 13px; margin-bottom: 8px; color: #667760; }
    select { width: 100%; font: inherit; padding: 12px; color: #244c39; border: 1px solid #cddcc7; border-radius: 10px; background: white; }
    .buttons { display: flex; gap: 10px; margin-top: 14px; } .buttons button { flex: 1; font-size: 14px; }
    output { display: block; font-size: 13px; color: #657665; margin-top: 14px; min-height: 20px; }
    .note { margin-top: 26px; font-size: 13px; } @media(max-width:650px) { .cards { grid-template-columns: 1fr; } header { align-items: flex-start; flex-direction: column; } }
  </style>
  <script src="/static/forest-animals.js?v=20260908-5" defer></script>
</head>
<body><main>
  <header><div><h1>여덟 가지 토끼 친구들</h1><p>숲에서 쉬고, 뛰고, 귀를 쫑긋해요.</p></div><a href="/forest?pets=v167">숲으로 들어가기</a></header>
  <section class="cards" aria-label="토끼 동작 미리보기"></section>
  <p class="note">원본 2종과 게임 내 털색 변형 6종입니다. 원본 모션과 눈·귀의 색은 유지합니다. 아래에서 동작을 고를 수 있고, 시스템의 동작 줄이기 설정도 적용됩니다.</p>
</main>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const animals = window.ForestAnimals;
    animals.rabbitVariants.forEach(variant => {
      const article = document.createElement("article");
      article.innerHTML = `<h2>${variant.label}</h2><div class="stage"><canvas width="720" height="480" role="img" aria-label="${variant.label} 동작"></canvas></div><label for="${variant.id}-action">동작 선택</label><select id="${variant.id}-action"></select><div class="buttons"><button type="button">일시정지</button><button type="button">다음 동작</button></div><output></output>`;
      document.querySelector(".cards").append(article);
      const select = article.querySelector("select"), output = article.querySelector("output");
      for (const name of variant.actions) {
        const option = document.createElement("option"); option.value = name;
        option.textContent = animals.rabbitAction(variant.id, name).label; select.append(option);
      }
      const canvas = article.querySelector("canvas"), ctx = canvas.getContext("2d");
      // Keep source pixels square even when the responsive card changes width.
      new ResizeObserver(() => {
        canvas.width = Math.round(canvas.clientWidth * 2);
        canvas.height = Math.round(canvas.clientHeight * 2);
      }).observe(canvas);
      const picture = new Image(); picture.src = animals.rabbitAssets.find(asset => asset.key === variant.sourceKey).url;
      picture.onerror = () => { output.textContent = "토끼 자산을 설치한 뒤 다시 열어주세요."; };
      let started = performance.now(), paused = false, pausedAt = 0, loaded = false, manual = false, skin = null;
      picture.onload = () => { skin = animals.createRabbitSkinCanvas(picture, variant.id); loaded = Boolean(skin); started = performance.now(); };
      const next = () => { select.selectedIndex = (select.selectedIndex + 1) % select.options.length; started = performance.now(); pausedAt = 0; };
      select.addEventListener("change", () => { started = performance.now(); pausedAt = 0; manual = true; });
      const [pause, advance] = article.querySelectorAll("button");
      pause.addEventListener("click", () => { if (paused) started = performance.now() - pausedAt; else pausedAt = performance.now() - started; paused = !paused; pause.textContent = paused ? "재생" : "일시정지"; });
      advance.addEventListener("click", () => { manual = false; next(); });
      function draw(now) {
        if (loaded) {
          let elapsed = paused ? pausedAt : now - started;
          const selected = animals.rabbitAction(variant.id, select.value);
          const time = manual ? elapsed % selected.durationMs : elapsed;
          const pose = animals.rabbitPose(variant.id, { action: selected.name, direction: selected.direction || "right", elapsedMs: time, reducedMotion: matchMedia("(prefers-reduced-motion: reduce)").matches });
          const rect = animals.frameRect(pose.key, pose.frame);
          ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.imageSmoothingEnabled = false;
          ctx.save(); ctx.translate(canvas.width / 2, canvas.height * .69); if (pose.flipX) ctx.scale(-1, 1);
          ctx.drawImage(skin, rect.x, rect.y, rect.width, rect.height, -96, -192, 192, 192); ctx.restore();
          output.textContent = `${select.selectedIndex + 1} / ${variant.actions.length} · ${selected.label}${paused ? " · 멈춤" : ""}`;
          if (!manual && !paused && elapsed >= selected.durationMs) next();
        }
        requestAnimationFrame(draw);
      }
      requestAnimationFrame(draw);
    });
  });
</script>
</body>
</html>
