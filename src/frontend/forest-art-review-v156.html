<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>가구 그림 검수 · v156</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:24px;background:#f4f4e9;color:#24452a;font:14px/1.5 system-ui,sans-serif}h1{font-size:24px;margin:0 0 8px}p{margin:4px 0 16px}#gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:16px}article{overflow:hidden;border:1px solid #b5c4a3;border-radius:12px;background:white}canvas{display:block;width:100%;aspect-ratio:1;image-rendering:pixelated;background:#7d925b}h2{margin:10px 14px;font-size:14px}small{display:block;margin:0 14px 12px;color:#637263}.fail{color:#a63823}a{color:#24664a}
  </style>
  <script src="/static/forest-objects.js?v=20260908-2" defer></script>
</head>
<body>
  <h1>메인 필드와 가구 그림 검수</h1>
  <p>실제 게임의 크기 정규화 방식으로 잔디 위에 합성합니다. 저장된 배치나 코디는 변경하지 않습니다. <a href="/forest?furniture=v156">게임으로</a></p>
  <p id="status" role="status">그림을 불러오는 중…</p>
  <main id="gallery"></main>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const load = url => new Promise((resolve,reject) => {
        const image=new Image();image.onload=()=>resolve(image);image.onerror=()=>reject(new Error(url));image.src=url;
      });
      const status=document.getElementById('status');
      const gallery=document.getElementById('gallery');
      try {
        const field=await load('/static/assets/carrot-forest-world-v6.png?v=20260907-1');
        let ready=0;
        await Promise.all(window.ForestObjects.INDIVIDUAL_ASSETS.map(async asset => {
          const card=document.createElement('article');
          const canvas=document.createElement('canvas');canvas.width=canvas.height=256;
          const title=document.createElement('h2');title.textContent=asset.code;
          const info=document.createElement('small');info.textContent=asset.url.includes('/furniture-v153/')?'원본 유지':'v156 · 메인 필드 픽셀 질감';
          card.append(canvas,title,info);gallery.append(card);
          const image=await load(asset.url);
          const tile=window.ForestObjects.createIndividualTile(image,256);
          const context=canvas.getContext('2d');context.imageSmoothingEnabled=false;
          context.drawImage(field,600,560,300,300,0,0,256,256);
          context.drawImage(tile,0,0);
          canvas.setAttribute('aria-label',asset.code+' 필드 합성 미리보기');
          ready++;status.textContent=`${ready} / 24개 확인`;
        }));
        status.dataset.ready='true';
      } catch(error) {status.textContent='불러오기 실패: '+error.message;status.classList.add('fail');}
    });
  </script>
</body>
</html>
