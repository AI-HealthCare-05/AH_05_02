name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: pw1234
          MYSQL_DATABASE: ai_health
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppw1234"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --all-groups --frozen
      - run: mysql -h 127.0.0.1 -P 3306 -uroot -ppw1234 -e "CREATE DATABASE IF NOT EXISTS test;"
      - name: Run tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: pw1234
          DB_NAME: ai_health
          SECRET_KEY: test-only-secret-key-please-change-123456
        run: uv run pytest -q
      - run: uv run ruff check app ai_worker
      - run: uv run ruff format app ai_worker --check
